interface:
  display_name: "逻辑工程"
  short_description: "把代码重建为可读、可修改、可验证并可跨语言生成实现的规范逻辑模型"
  default_prompt: "使用 $logic-engineering 处理模块级业务逻辑。优先使用中文描述逻辑、规则、状态、影响、证据和修改建议；仅在 Schema 字段、Semantic ID、工具名称或必要技术术语中保留英文。现有代码分析先恢复已观察行为，再区分推断、假设和未知，不在忠实解释阶段偷偷优化。新建或准备进入规范状态的模型优先使用 CLM v0.2。确定性工具链统一使用 Node.js 20+：CLM 结构与语义分别使用 scripts/schema_validate.mjs 和 scripts/validate_clm.mjs；通用投影/测试向量/哈希使用 scripts/logic_cli.mjs；Target Profile 先使用 schemas/target-profile-v0.1.schema.json 校验；IIR 编译使用 scripts/compile_iir.mjs，语义校验使用 scripts/validate_iir.mjs；Target Test Plan 使用 scripts/compile_target_tests.mjs；完整流程使用 scripts/run_pipeline.mjs；总回归使用 npm run regression。不要恢复已删除的 Python 双实现、旧 Validator、旧 Generator 或旧编译路径。单节点修改用 scripts/apply_patch.mjs，业务级多节点修改用 scripts/apply_change_set.mjs，并优先带 base_model_version + base_semantic_hash。修改后执行 scripts/analyze_impact.mjs，并从 CLM 独立生成中文逻辑和 Test Vector。实现前必须通过 Target Profile、IIR v0.2 Schema + Semantic Gate；blocking unresolved 非空时禁止目标代码生成。首个参考目标为 TypeScript 5.x + Node.js + SQLite + Vitest。当前已支持 Typed Guard、Assignment、Decision、Foreach scoped item、结构化 list/object Scenario、显式 SQLite mapping/upsert，以及 Atomicity full_behavior。Atomicity 生成必须遵循 references/transaction-generation.md：transaction callback 必须传入 transaction-scoped SqliteExecutor，Repository/Use Case 必须在事务回调内用该 executor 重建；依赖全部是生成 SQLite Repository 时自动生成 composition factory，存在未绑定 External Port 时 manifest 必须标记 manual_composition。生成后依次执行 manifest hash Gate、scripts/validate_generated_typescript.mjs 和 scripts/validate_generated_entrypoints.mjs；有事务的 Use Case 正式入口不得绕过 Transactional wrapper/composition。环境具备 tsc/vitest 时使用 scripts/verify_typescript.mjs 执行真实 typecheck/test Gate。TypeScript/Node.js/SQLite 只属于 Target Profile，不得污染 CLM。"
