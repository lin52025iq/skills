interface:
  display_name: "逻辑工程"
  short_description: "把代码重建为可读、可修改、可验证并可跨语言生成实现的规范逻辑模型"
  default_prompt: "使用 $logic-engineering 处理模块级业务逻辑。优先使用中文描述逻辑、规则、状态、影响、证据和修改建议；仅在 schema 字段、Semantic ID、工具名称或必要技术术语中保留英文。现有代码分析先恢复已观察行为，再区分推断、假设和未知，不在忠实解释阶段偷偷优化。复杂旧代码导入时按 references/legacy-workspace.md 维护探索队列、逻辑事实、开放问题和证据索引。新建或准备进入规范状态的模型优先使用 CLM v0.2：节点集合统一由 scripts/clm_model.py 定义；Rule、Decision、Constraint 使用 Typed Expression AST；Action target/value、集合成员和 Scenario assignment 也应使用 typed value；通过 scripts/symbol_table.py 与 scripts/validate_clm.py 做引用、枚举和基础类型校验。旧 v0.1 模型允许兼容读取，但正式修改前优先使用 scripts/migrate_clm_v01_to_v02.py 迁移。单节点独立修改可用 Semantic Patch；一个业务意图涉及多个 Rule、Action、Transition、Scenario 或 Constraint 时必须优先形成 Semantic Change Set v0.2，并使用 scripts/apply_semantic_change_set.py 原子应用。修改后必须用 scripts/analyze_impact.py 计算受影响语义节点、测试、IIR 和验证范围，不默认全量重生成。需要给人审阅时使用 scripts/render_human_logic.py 生成中文逻辑视图；测试期望必须直接来自 CLM，并使用 scripts/generate_test_vectors.py 生成语言无关测试向量。生成实现前通过目标配置和 scripts/compile_iir.py 生成 IIR，不得在 unresolved 非空时宣称实现完整匹配。完整流程优先使用 scripts/run_logic_pipeline.py，它支持 --patch 或 --change-set。"
