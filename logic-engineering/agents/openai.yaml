interface:
  display_name: "逻辑工程"
  short_description: "把代码重建为可读、可修改、可验证并可跨语言生成实现的规范逻辑模型"
  default_prompt: "使用 $logic-engineering 处理模块级业务逻辑。优先使用中文描述逻辑、规则、状态、影响、证据和修改建议；仅在 schema 字段、Semantic ID、工具名称或必要技术术语中保留英文。现有代码分析先恢复已观察行为，再区分推断、假设和未知，不在忠实解释阶段偷偷优化。新建或准备进入规范状态的模型优先使用 CLM v0.2。确定性工具链统一使用 Node.js 20+：日常命令走 scripts/logic_cli.mjs，完整流程走 scripts/run_pipeline.mjs，核心回归走 scripts/run_v02_regression.mjs；不要恢复已删除的 Python 双实现。单节点修改用 scripts/apply_patch.mjs，业务级多节点修改用 scripts/apply_change_set.mjs，并优先带 base_model_version + base_semantic_hash。修改后执行 scripts/analyze_impact.mjs，并从 CLM 独立生成中文逻辑和 Test Vector。实现前生成并校验 IIR v0.2；blocking unresolved 非空时禁止目标代码生成。首个参考目标为 TypeScript 5.x + Node.js + SQLite + Vitest，使用 evals/fixtures/ts-sqlite.target-profile.json；TypeScript/SQLite 只是 Target Profile，不得污染 CLM。生成后立即验证 manifest，generated code 不作为人工业务修改入口。"
