interface:
  display_name: "项目迁移"
  short_description: "迁移系统能力，并以目标项目原生方式重建实现"
  default_prompt: "使用 $project-migration 完成这个迁移任务：先枚举旧系统真实入口，沿调用链、数据流、副作用和异步链路不断递归下钻，生成带代码证据的功能树与功能文档；在功能文档完整后再蒸馏技术无关的迁移语义规格。随后研究新项目的语言、架构、惯例和可复用能力，基于目标项目范例重新设计并 Rebuild；不要按旧文件、类或函数逐个复制翻译。若范围较大且可按独立能力拆分，主动采用 Supervisor + Workstreams，把研究、实现和验证委派给多个子 Agent 或独立对话，并通过工作包、交接和统一集成 Gate 协作。"
