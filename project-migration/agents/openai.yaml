interface:
  display_name: "前端项目迁移"
  short_description: "证据化迁移前端功能，并按目标项目方式重建和验证"
  default_prompt: "使用 $project-migration 完成前端迁移任务。先识别源与目标根目录、任务规模和迁移模式，运行项目盘点脚本并研究两个项目的真实入口、Route、权限、状态、请求、组件库、样式、测试和发布方式。对源能力做 Active / Conditional / Hidden / Disabled / Deprecated / Removed / Unknown 分类，建立机器可读 manifest 与关键页面视觉/交互基线；未经批准不要 redesign，也不要按源文件和组件树逐个翻译。随后从目标项目中选择真实范例形成目标原生蓝图，优先使用官方 codemod，并先做代表性试迁移。最终以功能、运行时、视觉、响应式、Accessibility、残留扫描和回滚证据验收。大范围任务按稳定产品能力拆 Workstreams，由 Supervisor 统一 Gate。"
