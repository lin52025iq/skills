interface:
  display_name: "代码迁移"
  short_description: "基于真实源证据、目标方案与目标架构进行高保真能力迁移"
  default_prompt: "使用 $code-migration 识别 Source、Target、用户新方案和约束；顶层 03 只维护 Module 索引和派生进度，复杂模块通过相对链接进入 modules/<module>/00-模块总览.md，并以该模块 01-模块功能点.md 作为 Feature/Atomic Item 状态权威源。模块目录按复杂度自适应创建 02 功能语义、03 Source Behavior WHAT、04 页面结构/交互 HOW-WHERE；只为目标工作区中真实存在的文档生成链接，全局共享事实才写顶层 04/05/06。Checkbox 仅由 Atomic Item、Feature、Module 真实状态派生，不得手工勾选推进状态。Workstream/Batch 只引用 Atomic Item ID 和权威模块文件；按风险控制 Discovery、契约和验证强度，用户已确认的新 UX/布局/交互方案优先于 Source 旧形态。"
