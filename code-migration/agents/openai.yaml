interface:
  display_name: "代码迁移"
  short_description: "基于源项目证据确定目标行为，并按目标架构进行多项目融合与增量迁移"
  default_prompt: "使用 $code-migration 根据用户上下文识别源项目、目标仓库、迁移目标和约束；若目标仓库已有 `.code-migration/`，先恢复状态总览、用户规则、功能台账、源行为和实际 Git/代码状态，若不存在则初始化必要迁移文档；根据功能风险选择低/中/高治理强度，明确迁移决策、处理方式和当前状态，中高风险时建立关键源行为与目标行为的可追踪映射并通过源行为覆盖检查；按功能子项切片开发和即时验证，验证失败显式标记为“验证失败”，复用目标/无需实施不伪造“已实施”；必要时启用受控并行工作流，并在强制条件命中时执行集成验证，持续更新跨会话迁移状态。"
