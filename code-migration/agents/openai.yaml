interface:
  display_name: "代码迁移"
  short_description: "基于源项目证据确定目标行为，并按目标架构进行多项目融合与增量迁移"
  default_prompt: "使用 $code-migration 根据用户上下文识别源项目、目标仓库、迁移目标和约束；若目标仓库已有 `.code-migration/`，先恢复 Active Workstreams、用户规则、功能台账、Source Behavior 和实际 Git/代码状态，若不存在则初始化必要迁移文档；实施前建立关键源行为与目标行为的可追踪映射并通过 Source Coverage Gate，按 Feature Item 切片开发和即时验证，必要时对通过并行安全检查且工作区可隔离的独立 Feature 启用多个受控 Workstream，记录 Input Baseline 与 Owner，并在合并后执行必要的 Integration Gate，持续更新跨会话迁移状态。"
