interface:
  display_name: "代码迁移"
  short_description: "基于源项目证据确定目标行为，并按目标架构进行多项目融合与增量迁移"
  default_prompt: "使用 $code-migration 根据用户上下文识别源项目、目标仓库、迁移目标和约束；若目标仓库已有 `.code-migration/`，先恢复活跃工作流、用户规则、功能台账、源行为、输入基线以及实际 Git/代码状态，若不存在则在目标仓库初始化必要迁移文档；所有运行时文档优先使用中文字段、中文状态和中文迁移决策。实施前建立关键源行为与目标行为的可追踪映射并通过源行为覆盖检查，功能、功能子项和源行为都必须显式维护当前状态；按功能子项切片开发并即时验证，必要时对通过并行安全检查且工作区可隔离的独立功能启用多个受控工作流，记录输入基线、实施负责人和验证负责人，并在合并后执行必要的集成验证，持续更新跨会话迁移状态。"
