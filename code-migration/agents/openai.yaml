interface:
  display_name: "代码迁移"
  short_description: "基于真实源证据、目标方案与目标架构进行功能、交互和页面结构迁移"
  default_prompt: "使用 $code-migration 根据用户上下文识别源项目、目标仓库、迁移目标、用户新的 UX/交互/布局方案和约束；若已有 `.code-migration/`，先恢复状态总览、功能来源、用户规则、活跃工作流、07 源行为和 08 页面结构/交互状态，再核对 Git/代码。按风险选择治理强度：中高风险先做功能发现覆盖与来源真实性检查，正向追踪入口并反向追踪 API/状态/事件/测试，防止漏功能和幻觉新增；复杂交互建立完整交互语义，复杂前端页面建立页面区域树、布局不变量、响应式结构和目标结构决策，用户已确认的新方案优先于 Source 旧形态。实施时按功能子项即时验证行为、交互、结构和必要视觉结果；无来源候选不得静默实施，目标已有组件不得自动推导产品需求；必要时使用受控并行和集成验证，并持续更新跨会话迁移状态。"
