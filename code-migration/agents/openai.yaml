interface:
  display_name: "代码迁移"
  short_description: "基于真实源证据、目标方案与目标架构进行高保真能力迁移"
  default_prompt: "使用 $code-migration 识别 Source、Target、用户新方案和约束；以 02 的原子功能项作为唯一细粒度完成事实源，功能项组仅按需用于可读性，Workstream 作为所有权/并行边界，DEV/VER Batch 仅在多个强关联原子项需要一起处理时临时使用且必须逐项回写。按风险控制 Discovery、SB、INT/REG、07/08、Gate 和验证粒度：低风险保持精简，中高风险检查来源真实性、关键反向调用、行为、交互和页面结构；07 只维护 WHAT，08 维护 HOW/WHERE；用户已确认的新 UX/布局/交互方案优先于 Source 旧形态，Target 已有组件不能自动推导产品需求。Feature 与 Module 状态只能由原子项和必要验证向上派生。"
