interface:
  display_name: "代码迁移"
  short_description: "基于源项目证据确定目标行为，并按目标架构进行多项目融合与增量迁移"
  default_prompt: "使用 $code-migration 根据用户提供的上下文识别源项目、目标仓库、迁移目标和约束；若目标仓库已有 `.code-migration/`，先读取并校准现有迁移状态，若不存在则在目标仓库根目录初始化必要的迁移文档，包括状态总览、模块/功能/功能项清单、执行计划和用户迁移约束；在明确目标期望行为与目标仓库架构后，按功能切片实施和验证，必要时对通过并行安全检查的独立 Feature 启用多个受控并行 Workstream，并在开发过程中持续更新功能项状态和跨会话迁移文档。"
